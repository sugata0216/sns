<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('マイページ', ~{::link})}">
  <link rel="stylesheet" th:href="@{/css/timeline.css}">
  <link rel="stylesheet" th:href="@{/css/profile.css}">
</head>
<body>
  <div class="tl-root">
    <!--左サイドバー-->
    <div th:replace="~{layout :: nav}"></div>
    <!--中央(プロフィール)-->
    <main class="tl-center" id="page-main">
      <!--ページヘッダー-->
      <div class="prof-page-header">
        <a href="#" id="back-btn" class="back-btn" aria-label="戻る">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6" />
          </svg>
        </a>
        <div>
          <div class="prof-page-name" th:text="${user.username}"></div>
          <div class="prof-page-count" th:text="${#lists.size(posts)} + '件のポスト'"></div>
        </div>
      </div>
      <!--カバー画像-->
      <div class="cover-wrap">
        <div class="cover-img"></div>
        <div class="avatar-wrap">
          <img th:if="${user.avatarPath != null}"
               th:src="${#strings.startsWith(user.avatarPath, 'http') ? user.avatarPath : '/' + user.avatarPath}"
               class="prof-avatar" />
          <div th:unless="${user.avatarPath != null}" class="prof-avatar" th:text="${#strings.substring(user.username, 0, 1).toUpperCase()}"></div>
        </div>
        <button class="edit-btn" id="open-modal-btn">プロフィールを編集</button>
      </div>
      <!--プロフィール情報-->
      <div class="prof-info">
        <div class="prof-name" th:text="${user.username}"></div>
        <div class="prof-handle" th:text="'@' + ${user.handle}"></div>
        <div class="prof-bio" th:text="${user.bio}" th:if="${user.bio != null and !user.bio.isEmpty()}"></div>
        <div class="prof-meta">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
            <line x1="16" y1="2" x2="16" y2="6" /><line x1="8" y1="2" x2="8" y2="6" />
            <line x1="3" y1="10" x2="21" y2="10" />
          </svg>
          <span th:text="${user.createdAt != null} ? ${#temporals.format(user.createdAt, 'yyyy年MM月')} + 'からYを利用しています' : 'Yを利用中'"></span>
        </div>
        <div class="prof-follow">
          <div><span class="follow-count">0</span> <span class="follow-label">フォロー中</span></div>
          <div><span class="follow-count">0</span> <span class="follow-label">フォロワー</span></div>
        </div>
      </div>
      <!--タブ-->
      <div class="tab-bar">
        <div class="tab active">ポスト</div>
      </div>
      <!--投稿一覧-->
      <div th:each="post : ${posts}" class="post-item">
        <img th:if="${user.avatarPath != null}"
             th:src="${#strings.startsWith(user.avatarPath, 'http') ? user.avatarPath : '/' + user.avatarPath}"
             class="avatar" />
        <div th:unless="${user.avatarPath != null}" class="avatar" th:text="${#strings.substring(user.username, 0, 1).toUpperCase()}"></div>
        <div class="post-body">
          <div class="post-header">
            <span class="post-name" th:text="${user.username}"></span>
            <span class="post-time" th:text="'· ' + ${@timeFormatUtil.format(post.createdAt)}"></span>
          </div>
          <div class="post-content" th:text="${post.content}"></div>
          <img
                  th:if="${!#strings.isEmpty(post.imagePath) and !#strings.endsWith(post.imagePath, '.mp4') and !#strings.endsWith(post.imagePath, '.mov') and !#strings.endsWith(post.imagePath, '.webm')}"
                  th:src="${#strings.startsWith(post.imagePath, 'http') ? post.imagePath : '/' + post.imagePath}"
                  class="post-img">
          <video
                  th:if="${!#strings.isEmpty(post.imagePath) and (#strings.endsWith(post.imagePath, '.mp4') or #strings.endsWith(post.imagePath, '.mov') or #strings.endsWith(post.imagePath, '.webm'))}"
                  th:src="${#strings.startsWith(post.imagePath, 'http') ? post.imagePath : '/' + post.imagePath}"
                  class="post-img"
                  controls>
          </video>
          <div class="post-foot">
              <button class="foot-btn comment-btn"
                      th:data-post-id="${post.postId}"
                      th:data-post-username="${user.username}"
                      th:data-post-handle="${user.handle}"
                      th:data-post-avatar="${user.avatarPath}"
                      th:data-post-content="${post.content}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                </svg>
                <span th:if="${post.commentCount > 0}" th:text="${post.commentCount}"></span>
              </button>
              <form th:action="@{'/like/' + ${post.postId}}" method="post">
                <button th:class="${post.likedByMe} ? 'foot-btn like-btn liked' : 'foot-btn like-btn'" type="submit">
                  <svg width="18" height="18" viewBox="0 0 24 24"
                       th:fill="${post.likedByMe} ? '#f91880' : 'none'"
                       stroke="currentColor" stroke-width="1.8">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
                  </svg>
                  <span th:if="${post.likeCount > 0}" th:text="${post.likeCount}"></span>
                </button>
              </form>
            <form class="delete-form"
                  th:data-post-id="${post.postId}"
                  th:action="@{'/post/delete/' + ${post.postId}}" method="post">
              <button class="foot-btn delete-btn" type="submit" aria-label="削除">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <polyline points="3 6 5 6 21 6" />
                  <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                  <path d="M10 11v6" /><path d="M14 11v6" />
                  <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
                </svg>
              </button>
            </form>
            <button class="foot-btn edit-btn-icon"
                    type="button"
                    aria-label="編集"
                    th:data-post-id="${post.postId}"
                    th:data-post-image="${post.imagePath}"
                    th:data-post-content="${post.content}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                <path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z" />
              </svg>
            </button>
          </div>
        </div>
      </div>
      <!--投稿なし-->
      <div th:if="${#lists.isEmpty(posts)}" class="empty-state">
        まだポストがありません
      </div>
    </main>
    <!--右サイドバー-->
    <div th:replace="~{layout :: aside}"></div>
    <div th:replace="~{layout :: commentModal}"></div>
    <!--削除確認モーダル-->
    <div class="modal-overlay" id="delete-modal" aria-hidden="true">
      <div class="modal delete-confirm-modal" role="dialog" aria-modal="true">
        <div class="delete-confirm-body">
          <h3 class="delete-confirm-title">ポストを削除しますか？</h3>
          <p class="delete-confirm-text">この操作は取り消せません。</p>
        </div>
        <div class="delete-confirm-actions">
          <button type="button" id="delete-confirm-btn" class="delete-confirm-btn">削除する</button>
          <button type="button" id="delete-cancel-btn" class="delete-cancel-btn">キャンセル</button>
        </div>
      </div>
    </div>
    <!--編集モーダル-->
    <div class="modal-overlay" id="edit-modal" aria-hidden="true">
      <div class="modal edit-modal" role="dialog" aria-modal="true">
        <div class="modal-header">
          <button type="button" id="edit-close-btn" class="modal-close" aria-label="閉じる">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
          <span class="modal-title">ポストを編集</span>
          <button type="submit" form="edit-post-form" class="modal-save-btn">保存</button>
        </div>
        <form id="edit-post-form" method="post" enctype="multipart/form-data" class="edit-modal-body">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <textarea id="edit-content-input" name="content" rows="5"></textarea>
          <div class="inline-error" id="edit-error" style="display:none;"></div>
          <div id="edit-current-media-wrap" class="edit-media-wrap" style="display:none;">
            <img id="edit-current-img" style="display:none;">
            <video id="edit-current-video" style="display:none;" controls></video>
            <button type="button" id="edit-remove-media-btn" class="reply-preview-remove">×</button>
          </div>
          <input type="hidden" id="edit-remove-image-input" name="removeImage" value="false">
          <label for="edit-image-input" class="file-upload-btn">画像・動画を変更</label>
          <input type="file" id="edit-image-input" name="image" accept="image/*,video/*" class="file-upload-input">
          <div class="inline-error" id="edit-file-error" style="display:none;"></div>
        </form>
      </div>
    </div>
    <!--モーダルオーバーレイ(初期非表示)-->
    <div class="modal-overlay" id="modal-overlay" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-header">
          <div class="modal-header-contents">
            <!--×ボタンでモーダルを閉じる-->
            <button class="modal-close" id="close-modal-btn" aria-label="閉じる">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" />
              </svg>
            </button>
            <span class="modal-title">プロフィールを編集</span>
          </div>
          <button type="submit" form="edit-form" class="modal-save-btn">保存</button>
        </div>
        <div class="modal-cover">
          <div class="modal-cover-img"></div>
          <div class="modal-avatar-wrap">
            <img th:if="${user.avatarPath != null}"
                 th:src="${#strings.startsWith(user.avatarPath, 'http') ? user.avatarPath : '/' + user.avatarPath}"
                 class="modal-avatar" />
            <div th:unless="${user.avatarPath != null}" class="modal-avatar" th:text="${#strings.substring(user.username, 0, 1).toUpperCase()}"></div>
          </div>
        </div>
        <form id="edit-form"
              th:action="@{/profile/edit}"
              th:object="${profileForm}"
              method="post"
              enctype="multipart/form-data"
              class="modal-body">
          <div class="edit-field">
            <div class="edit-field-label">名前</div>
            <input type="text" th:field="*{username}" placeholder="名前" />
          </div>
          <div class="inline-error" id="profile-name-error" style="display:none;"></div>
          <div class="edit-field">
            <div class="edit-field-label">自己紹介</div>
            <textarea th:field="*{bio}" placeholder="自己紹介"></textarea>
          </div>
          <div class="edit-field">
            <div class="edit-field-label">アイコン画像</div>
              <input type="file" th:field="*{avatar}" accept="image/*">
              <div class="inline-error" id="avatar-file-error" style="display:none;"></div>
            </div>
        </form>
      </div>
    </div>
  </div>
  <script type="text/javascript" th:src="@{/js/file-validation.js}"></script>
  <script type="text/javascript" th:src="@{/js/profile.js}"></script>
  <script type="text/javascript" th:src="@{/js/comment-modal.js}"></script>
  <script type="text/javascript" th:src="@{/js/post-actions.js}"></script>
</body>
</html>
