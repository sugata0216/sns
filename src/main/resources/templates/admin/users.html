<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('ユーザー管理', ~{::link})}">
  <link rel="stylesheet" th:href="@{/css/users.css}">
</head>
<body class="admin-body">
  <div class="page">
    <!--ヘッダー-->
    <div class="page-header">
      <div class="page-header-left">
        <a th:href="@{/admin}" class="back-link">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          管理者画面へ戻る
        </a>
        <div>
          <div class="page-title">ユーザー管理</div>
          <div class="page-count" th:text="${#lists.size(users)} + '件のユーザー'"></div>
        </div>
      </div>
    </div>
    <!--テーブル-->
    <div class="table-card">
      <div class="table-card-header">
        <span class="table-card-title">ユーザー一覧</span>
      </div>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>ユーザー名</th>
            <th>メールアドレス</th>
            <th>ロール</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
          <td class="id-cell" th:text="'#' + ${user.userId}"></td>
          <td>
            <div class="user-cell">
              <img th:if="${user.avatarPath != null}"
                   th:src="${#strings.startsWith(user.avatarPath, 'http') ? user.avatarPath : '/' + user.avatarPath}"
                   class="user-avatar" />
              <div th:unless="${user.avatarPath != null}" class="user-avatar"
                   th:text="${#strings.substring(user.username, 0, 1).toUpperCase()}"></div>
              <span th:text="${user.username}"></span>
            </div>
          </td>
          <td th:text="${user.email}"></td>
          <td>
            <span class="badge"
              th:classappend="${user.roleName == 'ADMIN'} ? 'badge-admin' : 'badge-user'"
              th:text="${user.roleName}"></span>
          </td>
          <td>
            <div class="action-cell">
              <a th:href="@{'/admin/users/edit/' + ${user.userId}}" class="edit-btn">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                  <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                </svg>
                編集
              </a>
              <form th:action="@{'/admin/users/delete/' + ${user.userId}}"
                method="post" class="delete-form"
                onsubmit="return confirm('本当に削除しますか?')">
                <button type="submit" class="delete-btn">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6"/>
                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                    <path d="M10 11v6"/><path d="M14 11v6"/>
                    <path d="M9 6V4h6v2"/>
                  </svg>
                  削除
                </button>
              </form>
            </div>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
