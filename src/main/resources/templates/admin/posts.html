<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('投稿管理', ~{::link})}">
    <link rel="stylesheet" th:href="@{/css/posts.css}">
</head>
<body class="admin-body">
    <div class="page">
        <!--ヘッダー-->
        <div class="page-header">
            <div class="page-header-left">
                <a th:href="@{/admin}" class="back-link">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="15 18 9 12 15 6"/>
                    </svg>
                    管理者TOPに戻る
                </a>
                <div>
                    <div class="page-title">投稿管理</div>
                    <div class="page-count" th:text="${#lists.size(posts)} + '件の投稿'"></div>
                </div>
            </div>
        </div>
        <!--テーブル-->
        <div class="table-card">
            <div class="table-card-header">
                <span class="table-card-title">投稿一覧</span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>投稿者</th>
                        <th>内容</th>
                        <th>画像</th>
                        <th>投稿日時</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="post : ${posts}">
                        <td class="id-cell" th:text="'#' + ${post.postId}"></td>
                        <td>
                            <div class="user-cell">
                                <img th:if="${post.avatarPath != null}" th:src="@{'/' + ${post.avatarPath}}" class="user-avatar" />
                                <div th:unless="${post.avatarPath != null}" class="user-avatar"
                                     th:text="${#strings.substring(post.username, 0, 1).toUpperCase()}"></div>
                                <span th:text="${post.username}"></span>
                            </div>
                        </td>
                        <td>
                            <div class="content-cell" th:text="${post.content}"></div>
                        </td>
                        <td>
                            <img th:if="${!#strings.isEmpty(post.imagePath) and !#strings.endsWith(post.imagePath, '.mp4') and !#strings.endsWith(post.imagePath, '.mov') and !#strings.endsWith(post.imagePath, '.webm')}"
                                th:src="@{'/' + ${post.imagePath}}"
                                class="post-img" alt="投稿画像">
                            <video th:if="${!#strings.isEmpty(post.imagePath) and (#strings.endsWith(post.imagePath, '.mp4') or #strings.endsWith(post.imagePath, '.mov') or #strings.endsWith(post.imagePath, '.webm'))}"
                                   th:src="@{'/' + ${post.imagePath}}"
                                   class="post-img"
                                   controls>
                            </video>
                            <div th:if="${#strings.isEmpty(post.imagePath)}" class="no-img">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                    <rect x="3" y="3" width="18" height="18" rx="2" />
                                    <circle cx="8.5" cy="8.5" r="1.5" />
                                    <polyline points="21 15 16 10 5 21"/>
                                </svg>
                            </div>
                        </td>
                        <td class="time-cell" th:text="${#temporals.format(post.createdAt, 'yyyy/MM/dd HH:mm')}"></td>
                        <td>
                            <form th:action="@{/admin/posts/delete/{id}(id=${post.postId})}"
                                method="post" class="delete-form"
                                onsubmit="return confirm('この投稿を削除しますか?')">
                                <button type="submit" class="delete-btn">
                                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="3 6 5 6 21 6"/>
                                        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                                        <path d="M10 11v6"/><path d="M14 11v6"/>
                                        <path d="M9 6V4h6v2"/>
                                    </svg>
                                    削除
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script type="text/javascript" th:src="@{/js/posts.js}"></script>
</body>
</html>
