<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('管理者画面', ~{::link})}">
  <link rel="stylesheet" th:href="@{/css/index.css}">
</head>
<body class="admin-body">
  <div class="dashboard">
    <!--ヘッダー-->
    <div class="dash-header">
      <div class="dash-title-wrap">
        <svg width="36" height="40" viewBox="0 0 36 40" fill="none">
          <path d="M4 4 L18 20" stroke="#0f1419" stroke-width="4" stroke-linecap="round"/>
          <path d="M32 4 L18 20" stroke="#0f1419" stroke-width="4" stroke-linecap="round"/>
          <path d="M18 20 L18 36" stroke="#0f1419" stroke-width="4" stroke-linecap="round"/>
        </svg>
        <div>
          <div class="dash-title">管理者ダッシュボード</div>
          <div class="dash-subtitle">Y Admin Panel</div>
        </div>
      </div>
      <a th:href="@{/timeline}" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        タイムラインへ戻る
      </a>
    </div>
  </div>
  <!--サマリーカード-->
  <div class="cards">
    <div class="card">
      <div class="card-icon blue">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4" />
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
      </div>
      <div class="card-label">ユーザー数</div>
      <div class="card-value" th:text="${userCount}">0</div>
    </div>
    <div class="card">
      <div class="card-icon green">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
      </div>
      <div class="card-label">投稿数</div>
      <div class="card-value" th:text="${postCount}">0</div>
    </div>
  </div>
  <!--統計テーブル-->
  <div class="table-card">
    <div class="table-card-header">統計サマリー</div>
    <table>
      <thead>
        <tr>
          <th>項目</th>
          <th>件数</th>
          <th>カテゴリ</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>ユーザー数</td>
          <td><strong th:text="${userCount}"></strong></td>
          <td><span class="badge badge-blue">アカウント</span></td>
        </tr>
      <tr>
        <td>投稿数</td>
        <td><strong th:text="${postCount}"></strong></td>
        <td><span class="badge badge-green">コンテンツ</span></td>
      </tr>
      </tbody>
    </table>
  </div>
  <!--管理ナビ-->
  <div class="nav-links">
    <a th:href="@{/admin/users}" class="nav-link">
      <div class="nav-link-icon blue">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4" />
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
      </div>
      ユーザー管理
    </a>
    <a th:href="@{/admin/posts}" class="nav-link">
      <div class="nav-link-icon green">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
      </div>
      投稿管理
    </a>
  </div>
</body>
</html>
