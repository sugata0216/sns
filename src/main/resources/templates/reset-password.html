<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('新しいパスワードの設定', ~{::link})}">
    <link rel="stylesheet" th:href="@{/css/reset-password.css}">
</head>
<body>
<div class="card">
    <div class="y-logo">
        <svg width="32" height="36" viewBox="0 0 36 40" fill="none">
            <path d="M4 4 L18 20" stroke="#0f1419" stroke-width="4" stroke-linecap="round"/>
            <path d="M32 4 L18 20" stroke="#0f1419" stroke-width="4" stroke-linecap="round"/>
            <path d="M18 20 L18 36" stroke="#0f1419" stroke-width="4" stroke-linecap="round"/>
        </svg>
    </div>
    <h1>新しいパスワードの設定</h1>
    <p class="description">新しく利用するパスワードを入力してください。</p>
    <div class="error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
    <form th:action="@{/reset-password}" method="post">
        <input type="hidden" name="token" th:value="${token}" />
        <div class="field-wrap">
            <input type="password" id="newPassword" name="newPassword"
                   placeholder=" " required autofocus />
            <label for="newPassword">新しいパスワード</label>
            <button type="button" class="eye-btn" id="eye-btn" aria-label="パスワードを表示">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3" />
                </svg>
            </button>
        </div>
        <button type="submit" class="submit-btn">パスワードを更新</button>
    </form>
    <div class="back-wrap">
        <a class="back-link" th:href="@{/login}">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"/>
            </svg>
            ログイン画面に戻る
        </a>
    </div>
</div>
<script type="text/javascript" th:src="@{/js/reset-password.js}"></script>
</body>
</html>
