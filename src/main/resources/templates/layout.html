<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head th:fragment="head(title, links)">
    <meta charset="UTF-8">
    <title th:text="${title}">Title</title>
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <th:block th:replace="${links}" />
</head>
<body>
    <!--左サイドバー-->
    <nav class="tl-left" th:fragment="nav">
        <div class="y-logo">
            <a th:href="@{/timeline}" aria-label="ホーム">
                <svg width="28" height="32" viewBox="0 0 36 40" fill="none">
                    <path d="M4 4 L18 20" stroke="#0f1419" stroke-width="4" stroke-linecap="round" />
                    <path d="M32 4 L18 20" stroke="#0f1419" stroke-width="4" stroke-linecap="round" />
                    <path d="M18 20 L18 33" stroke="#0f1419" stroke-width="4" stroke-linecap="round" />
                </svg>
            </a>
        </div>
        <a th:href="@{/timeline}" class="nav-btn active" aria-label="ホーム">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
        </a>
        <a th:href="@{/search}" class="nav-btn" aria-label="検索">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
        </a>
        <!--通知アイコン(バッジ付き)-->
        <a th:href="@{/notifications}" class="nav-btn nav-btn--notify" aria-label="通知">
            <svg width="24" height="24" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                <path d="M13.73 21a2 2 0 0 1-3.46 0" />
            </svg>
            <!--未読件数が1以上の時だけバッジを表示-->
            <span class="notify-badge"
                  th:if="${notificationCount != null and notificationCount > 0}"
                  th:text="${notificationCount > 99} ? '99+' : ${notificationCount}">
            </span>
        </a>
        <a th:href="@{/profile}" class="nav-btn" aria-label="プロフィール">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
            </svg>
        </a>
        <!--ログアウト-->
        <form th:action="@{/logout}" method="post" class="logout-form">
            <button type="submit" class="nav-btn" aria-label="ログアウト">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
            </button>
        </form>
    </nav>
    <!--右サイドバー-->
    <aside class="tl-right" th:fragment="aside">
        <div class="search-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <form th:action="@{/search}" method="get">
                <input type="text" name="keyword" placeholder="検索">
            </form>
        </div>
    </aside>
    <!--コメントモーダル(共通フラグメント)-->
    <div class="modal-overlay" id="comment-modal" th:fragment="commentModal" aria-hidden="true">
        <div class="modal" role="dialog" aria-modal="true">
            <div class="modal-header">
                <button class="modal-close" id="modal-close-btn" aria-label="閉じる">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="reply-to-post">
                <div class="avatar" id="modal-avatar-wrap"></div>
                <div class="reply-to-body">
                    <div class="reply-to-header">
                        <span class="reply-to-name" id="modal-username"></span>
                        <span class="reply-to-handle" id="modal-handle"></span>
                    </div>
                    <div class="reply-to-content" id="modal-content"></div>
                    <div class="reply-to-dest">返信先: <span id="modal-dest"></span>さん</div>
                </div>
            </div>
            <div class="comment-list" id="comment-list"></div>
            <div class="reply-compose">
                <img th:if="${avatarPath != null}"
                     th:src="${#strings.startsWith(avatarPath, 'http') ? avatarPath : '/' + avatarPath}"
                     class="avatar" />
                <div th:unless="${avatarPath != null}" class="avatar" th:text="${#strings.substring(username, 0, 1).toUpperCase()}">Y</div>
                <form id="commentForm" th:action="@{/comment}" method="post" enctype="multipart/form-data" class="comment-form">
                    <input type="hidden" name="postId" id="modal-post-id" />
                    <textarea name="content" placeholder="返信をポスト" rows="3"></textarea>
                    <div class="inline-error" id="comment-error" style="display:none;"></div>
                    <div class="reply-preview-wrap" id="reply-preview-wrap" style="display:none;">
                        <img id="reply-preview-img" style="display:none;">
                        <video id="reply-preview-video" style="display:none;" controls></video>
                        <button type="button" id="reply-preview-remove" class="reply-preview-remove">×</button>
                    </div>
                    <input type="file" id="reply-image-input" name="image" accept="image/*,video/*" style="display:none;">
                    <div class="inline-error" id="reply-file-error" style="display:none;"></div>
                    <div class="modal-footer">
                        <div class="footer-icons">
                            <button type="button" class="icon-btn" id="reply-image-btn" aria-label="画像">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                                    <rect x="3" y="3" width="18" height="18" rx="2" /><circle cx="8.5" cy="8.5" r="1.5" />
                                    <polyline points="21 15 16 10 5 21" />
                                </svg>
                            </button>
                        </div>
                        <button type="submit" class="reply-btn">返信</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
