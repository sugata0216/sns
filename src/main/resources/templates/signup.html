<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('ユーザー登録', ~{::link})}">
    <link rel="stylesheet" th:href="@{/css/signup.css}">
</head>
<body>
    <div class="signup-card">
        <div class="y-logo">
            <svg width="36" height="40" viewBox="0 0 36 40" fill="none">
                <path d="M4 4 L18 20" stroke="#0f1419" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M32 4 L18 20" stroke="#0f1419" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M18 20 L18 33" stroke="#0f1419" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </div>
        <h2>ユーザー登録</h2>
        <div th:if="${errorMessage}" class="error">
            <p th:text="${errorMessage}"></p>
        </div>
        <form th:action="@{/signup}" th:object="${signupForm}" method="post" class="signup-form">
            <div class="field-wrap input-wrap">
                <input type="text" th:field="*{username}" placeholder=" " required />
                <label>ユーザー名</label>
            </div>
            <div class="field-wrap input-wrap">
                <input type="email" th:field="*{email}" placeholder=" " required />
                <label>メールアドレス</label>
            </div>
            <div class="field-wrap input-wrap">
                <input type="password" th:field="*{password}" id="password" placeholder=" " required />
                <label>パスワード</label>
                <button type="button" class="eye-btn" id="eye-btn" aria-label="パスワードを表示">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                </button>
            </div>
            <div class="field-wrap textarea-wrap">
                <textarea th:field="*{bio}" placeholder=" "></textarea>
                <label>自己紹介</label>
            </div>
            <button type="submit" class="submit-btn">登録</button>
            <p class="terms">
                登録することで、<a th:href="@{/terms}">利用規約</a>、<a th:href="@{/privacy}">プライバシーポリシー</a>および<a th:href="@{/cookies}">Cookieの使用</a>に同意したものとみなされます。
            </p>
        </form>
        <p class="login-link">
            すでにアカウントをお持ちですか? <a th:href="@{/login}">ログイン</a>
        </p>
    </div>
    <script th:src="@{/js/signup.js}"></script>
</body>
</html>
