<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('通知', ~{::link})}">
    <link rel="stylesheet" th:href="@{/css/notifications.css}">
</head>
<body>
    <div class="tl-root">
        <div th:replace="~{layout :: nav}"></div>
        <main class="tl-center">
            <!--ヘッダー-->
            <div class="notif-header">
                <span class="notif-title">通知</span>Q
            </div>
            <!--タブ-->
            <div class="tab-bar">
                <div class="tab active">すべて</div>
            </div>
            <!--通知一覧-->
            <div th:each="notification : ${notifications}" class="notif-item">
                <!--通知種別アイコン-->
                <div class="notif-icon">
                    <!--いいね-->
                    <svg th:if="${notification.type == 'LIKE'}"
                        width="20" height="20" viewBox="0 0 24 24" fill="#f91880">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
                    </svg>
                    <!--フォロー-->
                    <svg th:if="${notification.type == 'FOLLOW'}"
                        width="20" height="20" viewBox="0 0 24 24" fill="#f91880">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                    </svg>
                    <!--コメント-->
                    <svg th:if="${notification.type == 'COMMENT'}"
                        width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="1d9bf0" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                    <!--リポスト-->
                    <svg th:if="${notification.type == 'REPOST'}"
                        width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="00ba7c" stroke-width="2">
                        <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
                        <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
                    </svg>
                </div>
                <!--通知本文-->
                <div class="notif-body">
                    <div class="notif-avatars">
                        <a th:href="@{'/user/' + ${notification.senderId}}" class="notif-avatar-link">
                            <img th:if="${notification.avatarPath != null}"
                                 th:src="${#strings.startsWith(notification.avatarPath, 'http') ? notification.avatarPath : '/' + notification.avatarPath}"
                                 class="notif-avatar" />
                            <div th:unless="${notification.avatarPath != null}"
                                 class="notif-avatar"
                                 th:text="${#strings.substring(notification.senderName, 0, 1).toUpperCase()}"></div>
                        </a>
                    </div>
                    <div class="notif-text">
                        <strong th:text="${notification.senderName}"></strong>
                        <!--種別ごとのメッセージ-->
                        <span th:if="${notification.type == 'LIKE'}">がポストをいいねしました</span>
                        <span th:if="${notification.type == 'FOLLOW'}">にフォローされました</span>
                        <span th:if="${notification.type == 'COMMENT'}">がポストに返信しました</span>
                        <span th:if="${notification.type == 'REPOST'}">がポストをリポストしました</span>
                    </div>
                    <!--対象ポストのプレビュー-->
                    <div class="notif-preview"
                        th:if="${notification.postContent != null}"
                        th:text="${notification.postContent}"></div>
                    <div class="notif-time" th:text="${@timeFormatUtil.format(notification.createdAt)}"></div>
                </div>
            </div>
            <!--通知なし-->
            <div th:if="${#lists.isEmpty(notifications)}" class="empty-state">
                通知はありません
            </div>
        </main>
        <div th:replace="~{layout :: aside}"></div>
    </div>
</body>
</html>
