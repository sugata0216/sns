<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('パスワードをお忘れの方', ~{::link})}">
  <link rel="stylesheet" th:href="@{/css/forgot-password.css}">
</head>
<body>
<div class="card">
  <div class="y-logo">
    <svg width="32" height="36" viewBox="0 0 36 40" fill="none">
      <path d="M4 4 L18 20" stroke="#0f1419" stroke-width="4" stroke-linecap="round"/>
      <path d="M32 4 L18 20" stroke="#0f1419" stroke-width="4" stroke-linecap="round"/>
      <path d="M18 20 L18 36" stroke="#0f1419" stroke-width="4" stroke-linecap="round"/>
    </svg>
  </div>
  <h1>パスワードをお忘れの方</h1>
  <p class="description">ご登録のメールアドレスを入力してください。パスワード再設定用のリンクをお送りします。メール送信は少々時間がかかります。</p>
  <!--成功メッセージ-->
  <div class="message" th:if="${message}" th:text="${message}"></div>
  <!--エラーメッセージ-->
  <div class="error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
  <form th:action="@{/forgot-password}" method="post">
    <div class="field-wrap">
      <input type="email" id="email" name="email"
              placeholder="" required autofocus>
      <label for="email">メールアドレス</label>
    </div>
    <button type="submit" class="submit-btn">再設定リンクを送信</button>
  </form>
  <div class="back-wrap">
    <a class="back-link" th:href="@{/login}">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      ログイン画面に戻る
    </a>
  </div>
</div>
</body>
</html>
